<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التقارير المحفوظة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a4d2e;
            --secondary: #4f9d69;
            --success: #2e7d32;
            --danger: #c1292e;
            --warning: #f57c00;
            --info: #0277bd;
            --purple: #5e35b1;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #212121;
            --text-secondary: #666;
            --border: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e8eaf0 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        header h1 {
            font-family: 'Amiri', serif;
            color: white;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-right: 5px solid var(--primary);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .stat-card.positive {
            border-right-color: var(--success);
        }

        .stat-card.negative {
            border-right-color: var(--danger);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(79, 157, 105, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: var(--bg);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .reports-grid {
            display: grid;
            gap: 20px;
        }

        .report-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-right: 5px solid var(--danger);
            transition: all 0.3s;
        }

        .report-card.positive {
            border-right-color: var(--success);
        }

        .report-card:hover {
            transform: translateX(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .student-info h3 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .student-info .meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .report-type {
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .report-type.positive {
            background: #e8f5e9;
            color: var(--success);
        }

        .report-type.negative {
            background: #ffebee;
            color: var(--danger);
        }

        .behaviors-list {
            background: var(--bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .behavior-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .behavior-item:last-child {
            border-bottom: none;
        }

        .behavior-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }

        .badge-positive {
            background: var(--success);
        }

        .badge-advice {
            background: var(--info);
        }

        .badge-warning {
            background: var(--warning);
        }

        .badge-alert {
            background: var(--danger);
        }

        .report-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: var(--info);
            color: white;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .empty-state-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 1.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10000;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                width: 100%;
            }
            
            .report-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="container">
        <header>
            <h1>📊 إدارة التقارير المحفوظة</h1>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-number" id="totalReports">0</div>
                <div class="stat-label">إجمالي التقارير</div>
            </div>
            <div class="stat-card positive">
                <div class="stat-number" id="positiveReports">0</div>
                <div class="stat-label">تقارير إيجابية</div>
            </div>
            <div class="stat-card negative">
                <div class="stat-number" id="negativeReports">0</div>
                <div class="stat-label">تقارير سلبية</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="goBack()">
                ⬅️ العودة للرئيسية
            </button>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 بحث عن طالب..." oninput="filterReports()">
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
                <button class="filter-btn" onclick="setFilter('positive', this)">إيجابية</button>
                <button class="filter-btn" onclick="setFilter('negative', this)">سلبية</button>
            </div>
        </div>

        <div class="reports-grid" id="reportsContainer">
            <!-- سيتم ملؤها بالـ JavaScript -->
        </div>
    </div>

    <script>
        // ضع نفس رابط Web App هنا
        const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbwIR8Utx0pbm02LfF45HR1JmUkgXSZwfGE7xS29Opypii9KUbp1NgET2ShwyOaewNY/exec';
        
        let currentFilter = 'all';
        let allReports = [];
        function accessCode_(){ return sessionStorage.getItem('accessCode') || ''; }
        async function api_(action, payload = {}) {
            const response = action === 'list'
              ? await fetch(`${GOOGLE_SHEET_URL}?action=list&accessCode=${encodeURIComponent(accessCode_())}`, {cache:'no-store'})
              : await fetch(GOOGLE_SHEET_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, accessCode:accessCode_(), ...payload})});
            const result = await response.json();
            if (!result.success) throw new Error(result.error || 'تعذر تنفيذ العملية');
            return result;
        }
        function escapeHTML(value='') { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        function openWhatsAppSmart(message){
            const text=encodeURIComponent(message), ua=navigator.userAgent || '';
            const isAndroid=/Android/i.test(ua);
            const isAppleMobile=/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
            if(isAndroid || isAppleMobile){
                let timer;
                document.addEventListener('visibilitychange',()=>{ if(document.hidden && timer) clearTimeout(timer); },{once:true});
                timer=setTimeout(()=>{ if(!document.hidden) window.location.href=`https://wa.me/?text=${text}`; },1600);
                window.location.href=isAndroid
                  ? `intent://send?text=${text}#Intent;scheme=whatsapp;package=com.whatsapp;end`
                  : `whatsapp://send?text=${text}`;
                showToast('✅ جاري فتح تطبيق واتساب...');
                return;
            }
            window.open(`https://web.whatsapp.com/send?text=${text}`,'_blank','noopener');
            showToast('✅ جاري فتح واتساب ويب...');
        }

        async function loadReports() {
            if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL === 'ضع_رابط_Web_App_هنا') {
                showToast('⚠️ يرجى إعداد Google Sheets أولاً');
                displayReports([]);
                return;
            }

            try {
                showToast('⏳ جاري تحميل التقارير...');
                
                const result = await api_('list');
                const reports = result.records;
                allReports = reports;
                
                // تحديث الإحصائيات
                document.getElementById('totalReports').textContent = reports.length;
                document.getElementById('positiveReports').textContent = reports.filter(r => r.isPositive).length;
                document.getElementById('negativeReports').textContent = reports.filter(r => !r.isPositive).length;
                
                filterReports();
                
            } catch (error) {
                console.error('خطأ في التحميل:', error);
                showToast('❌ فشل تحميل التقارير');
                displayReports([]);
            }
        }

        async function filterReports() {
            if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL === 'ضع_رابط_Web_App_هنا') {
                displayReports([]);
                return;
            }

            try {
                const reports = allReports;
                
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                
                let filtered = reports.filter(report => {
                    const matchesSearch = report.studentName.toLowerCase().includes(searchTerm);
                    const matchesFilter = 
                        currentFilter === 'all' ? true :
                        currentFilter === 'positive' ? report.isPositive :
                        !report.isPositive;
                    
                    return matchesSearch && matchesFilter;
                });
                
                displayReports(filtered.reverse()); // عرض الأحدث أولاً
                
            } catch (error) {
                console.error('خطأ في الفلترة:', error);
                displayReports([]);
            }
        }

        function displayReports(reports) {
            const container = document.getElementById('reportsContainer');
            
            if (reports.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h2>لا توجد تقارير محفوظة</h2>
                        <p style="color: var(--text-secondary); margin-top: 10px;">
                            ابدأ بإنشاء تقارير من الصفحة الرئيسية
                        </p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = reports.map(report => `
                <div class="report-card ${report.isPositive ? 'positive' : ''}">
                    <div class="report-header">
                        <div class="student-info">
                            <h3>👤 ${escapeHTML(report.studentName)}</h3>
                            <div class="meta">
                                <span>🏫 الشعبة: ${escapeHTML(report.className || 'غير محدد')}</span>
                                <span>📅 ${new Date(report.date).toLocaleDateString('ar-EG')}</span>
                            </div>
                        </div>
                        <div class="report-type ${report.isPositive ? 'positive' : 'negative'}">
                            ${report.isPositive ? '⭐ إيجابي' : '⚠️ سلبي'}
                        </div>
                    </div>
                    
                    <div class="behaviors-list">
                        <strong style="color: var(--primary); margin-bottom: 10px; display: block;">
                            ${report.isPositive ? '✨ نقاط التميز:' : '📋 السلوكيات:'}
                        </strong>
                        ${report.behaviors.map(behavior => `
                            <div class="behavior-item">
                                <span class="behavior-badge ${getBadgeClass(behavior, report.isPositive)}">
                                    ${getBadgeText(behavior, report.isPositive)}
                                </span>
                                <span>${escapeHTML(behavior)}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    ${report.notes ? `
                        <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-right: 3px solid var(--info);">
                            <strong>📝 ملاحظات:</strong><br>
                            <span style="color: var(--text-secondary);">${escapeHTML(report.notes)}</span>
                        </div>
                    ` : ''}
                    
                    ${report.action ? `
                        <div style="background: #fffbf0; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-right: 3px solid var(--warning);">
                            <strong>⚖️ الإجراء:</strong><br>
                            <span style="color: var(--text-secondary);">${escapeHTML(report.action)}</span>
                        </div>
                    ` : ''}
                    
                    <div class="report-actions">
                        <button class="action-btn btn-whatsapp" onclick="shareToWhatsApp('${report.timestamp}')">
                            📱 واتساب
                        </button>
                        <button class="action-btn btn-edit" onclick="editReport('${report.id}')">
                            ✏️ تعديل
                        </button>
                        <button class="action-btn btn-delete" onclick="deleteReport('${report.id}')">
                            🗑️ حذف
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getBadgeClass(behavior, isPositive) {
            if (isPositive) return 'badge-positive';
            
            const level1 = ['الحديث', 'الضحك', 'التحرك', 'اللعب', 'التشويش', 'عدم الإنصات', 'المقاطعة'];
            const level3 = ['الشجار', 'النميمة', 'المشاكل', 'التنمر', 'الاستيلاء'];
            
            for (let keyword of level3) {
                if (behavior.includes(keyword)) return 'badge-alert';
            }
            for (let keyword of level1) {
                if (behavior.includes(keyword)) return 'badge-advice';
            }
            return 'badge-warning';
        }

        function getBadgeText(behavior, isPositive) {
            if (isPositive) return '⭐';
            
            const level1 = ['الحديث', 'الضحك', 'التحرك', 'اللعب', 'التشويش', 'عدم الإنصات', 'المقاطعة'];
            const level3 = ['الشجار', 'النميمة', 'المشاكل', 'التنمر', 'الاستيلاء'];
            
            for (let keyword of level3) {
                if (behavior.includes(keyword)) return 'إنذار';
            }
            for (let keyword of level1) {
                if (behavior.includes(keyword)) return 'نصح';
            }
            return 'تنبيه';
        }

        function setFilter(filter, button) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (button) button.classList.add('active');
            
            filterReports();
        }

        async function deleteReport(id) {
            if (!confirm('هل أنت متأكد من حذف هذا التقرير؟\n(سيتم الحذف من السحابة)')) return;
            
            if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL === 'ضع_رابط_Web_App_هنا') {
                showToast('⚠️ يرجى إعداد Google Sheets أولاً');
                return;
            }

            try {
                showToast('⏳ جاري الحذف...');
                
                await api_('delete', {id});
                allReports = allReports.filter(r => r.id !== id);
                document.getElementById('totalReports').textContent = allReports.length;
                document.getElementById('positiveReports').textContent = allReports.filter(r=>r.isPositive).length;
                document.getElementById('negativeReports').textContent = allReports.filter(r=>!r.isPositive).length;
                filterReports();
                showToast('✅ تم حذف التقرير');
                
            } catch (error) {
                console.error('خطأ في الحذف:', error);
                showToast('❌ فشل الحذف');
            }
        }

        function editReport(id) {
            const report = allReports.find(r => r.id === id);
            if (!report) return;
            const notes = prompt('عدّل الملاحظات:', report.notes || '');
            if (notes === null) return;
            const actionTaken = prompt('عدّل الإجراء المتخذ:', report.action || '');
            if (actionTaken === null) return;
            api_('update', {...report, notes, actionTaken}).then(() => {
                report.notes = notes; report.action = actionTaken;
                filterReports(); showToast('✅ تم تعديل التقرير');
            }).catch(e => showToast(`❌ ${e.message}`));
        }

        async function shareToWhatsApp(timestamp) {
            try {
                const report = allReports.find(r => r.timestamp === timestamp);
                
                if (!report) {
                    showToast('⚠️ لم يتم العثور على التقرير');
                    return;
                }
                
                let message = `السلام عليكم ورحمة الله وبركاته\nولي أمر الطالب/ة: *${report.studentName}*\n\n`;
                
                if (report.isPositive) {
                    message += `⭐ *تقرير تقدير وتميز طلابي* ⭐\n\n`;
                } else {
                    message += `📋 *تقرير السلوك الطلابي* 📋\n\n`;
                }
                
                message += `📅 التاريخ: ${new Date(report.date).toLocaleDateString('ar-EG')}\n🏫 الشعبة: ${report.className || 'غير محدد'}\n\n`;
                
                if (report.isPositive) {
                    message += `✨ *نقاط التميز:*\n`;
                } else {
                    message += `📌 *السلوكيات المخالفة:*\n`;
                }
                
                report.behaviors.forEach((behavior, index) => {
                    message += `\n${index + 1}. ${behavior}`;
                });
                
                if (report.notes) message += `\n\n📝 *الملاحظات:*\n${report.notes}`;
                if (report.action) message += `\n\n⚖️ *الإجراء:*\n${report.action}`;
                
                openWhatsAppSmart(message);
                
            } catch (error) {
                console.error('خطأ:', error);
                showToast('❌ فشل إرسال الرسالة');
            }
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // تحميل التقارير عند فتح الصفحة
        window.addEventListener('load', loadReports);
    </script>
</body>
</html>
